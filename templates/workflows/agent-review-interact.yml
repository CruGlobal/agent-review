name: agent-review interact
on:
  issue_comment:
    types: [created]
jobs:
  interact:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@claude') &&
      (contains(github.event.comment.body, 'fix') || contains(github.event.comment.body, 'dismiss')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: CruGlobal/agent-review/.github/workflows/interact.yml@main
    with:
      command: ${{ github.event.comment.body }}
      actor: ${{ github.event.comment.user.login }}
      pr_number: ${{ github.event.issue.number }}
      auto_approve: false
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
