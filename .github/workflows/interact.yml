name: agent-review interact (reusable)
# Executes a dev's fix/dismiss command against a PR's findings ledger.
# Consumers call this from an issue_comment workflow after filtering for
# `@claude fix|dismiss` comments from trusted authors — this workflow trusts
# its caller's filtering and does no association checks of its own.
#
# Limitation: pushes go to the PR's head branch, so fork PRs can be dismissed
# but not auto-fixed (the token cannot push to a fork).
on:
  workflow_call:
    inputs:
      command:
        type: string
        required: true # the comment body, passed via env only — never into a shell line
      actor:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      auto_approve:
        description: Disabled during shadow/advisory rollout; enable only after readiness gates pass
        type: boolean
        default: false
    secrets:
      # Console API key only — subscription OAuth tokens are rejected for CI
      # use (see the note in review.yml).
      anthropic_api_key:
        required: true

jobs:
  address:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Check out the PR head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout "${{ inputs.pr_number }}"
      - name: Install bubblewrap
        # Claude Code 2.1.x refuses to start when subprocess env scrubbing is on
        # and bwrap is missing, and the ubuntu-latest image does not ship it.
        # Installing it (rather than setting CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=0)
        # keeps secrets out of the Bash subprocesses the agent runs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts the unprivileged user namespaces bwrap needs;
          # lift the AppArmor restriction only if the sandbox smoke test fails.
          if ! bwrap --dev-bind / / true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            bwrap --dev-bind / / true
          fi
      - uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ADDRESS_COMMAND: ${{ inputs.command }}
          ADDRESS_ACTOR: ${{ inputs.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/CruGlobal/agent-review.git'
          plugins: 'agent-review@cruglobal'
          prompt: '/agent-review:address ci'
      - name: Approve when the ledger is fully addressed and the change is reversible
        if: inputs.auto_approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        # Prefer the machine-readable `<!-- agent-review-status -->` line (pass +
        # irreversible flags); fall back to the `- [ ]` grep only for pre-status
        # reports. Irreversible changes never auto-approve — a human must.
        run: |
          BODY=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -sr '[.[][] | select(.body | startswith("<!-- agent-review -->"))] | last | .body // empty')
          [ -n "$BODY" ] || { echo "No report found — not approving."; exit 0; }
          ROLLOUT=$(printf '%s' "$BODY" | tr -d '\r' \
            | sed -n 's/^<!-- agent-review-rollout: \([a-z]*\) -->$/\1/p' | head -1)
          if [ "$ROLLOUT" = "shadow" ] || [ -z "$ROLLOUT" ]; then
            echo "Rollout is ${ROLLOUT:-unmarked} — shadow/unmarked reports never auto-approve."
            exit 0
          fi
          REPORT_HEAD=$(printf '%s' "$BODY" | tr -d '\r' \
            | sed -n 's/^<!-- agent-review-head: \([0-9a-f]\{7,40\}\) -->$/\1/p' | head -1)
          CURRENT_HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ -z "$REPORT_HEAD" ] || [ "$REPORT_HEAD" != "$CURRENT_HEAD" ]; then
            echo "Report covers ${REPORT_HEAD:-no head} but current head is $CURRENT_HEAD — waiting for incremental re-review."
            exit 0
          fi
          STATUS=$(printf '%s' "$BODY" | tr -d '\r' \
            | sed -n 's/^<!-- agent-review-status: \(.*\) -->$/\1/p' | head -1)
          if [ -n "$STATUS" ]; then
            PASS=$(printf '%s' "$STATUS" | jq -r '.pass // false')
            IRREVERSIBLE=$(printf '%s' "$STATUS" | jq -r '.irreversible // false')
            [ "$PASS" = "true" ] || { echo "Status: not passing — not approving."; exit 0; }
            if [ "$IRREVERSIBLE" = "true" ]; then
              echo "Status: passing but irreversible — human approval required, not auto-approving."
              exit 0
            fi
          elif printf '%s' "$BODY" | grep -q -- '- \[ \]'; then
            echo "Ledger still has open items — not approving."
            exit 0
          fi
          if ! gh pr review "$PR" --repo "$REPO" --approve \
            --body "Auto-approved: every agent-review finding is fixed or dismissed with a reason, and the change is reversible."; then
            echo "::warning::Approval failed — enable 'Allow GitHub Actions to create and approve pull requests' in repo/org Actions settings."
          fi
