name: agent-review withdraw (reusable)
# Takes back the bot's agent-review approval of an older commit when new
# commits land on a PR or its base branch changes, unless the push only merged
# in (or rebased onto) the default branch. Callers run it from
# pull_request_target, which is safe only because nothing here checks out or
# runs the PR's code: keep it that way.
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      expected_head:
        description: The PR head SHA from the triggering event; empty reads it from the API
        type: string
        required: false
        default: ''

jobs:
  withdraw:
    # Never the approve group, where an approve run would replace a waiting
    # withdraw run. Overlapping runs rely on the approve action's head check
    # after approving.
    concurrency:
      group: agent-review-withdraw-${{ inputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: withdraw
        uses: CruGlobal/agent-review/.github/actions/withdraw@main
        # Shorter than the job's, so a hung run still reaches the next step.
        timeout-minutes: 10
        continue-on-error: true
        with:
          pr_number: ${{ inputs.pr_number }}
          expected_head: ${{ inputs.expected_head }}
      - name: Tell the PR when the bot's approval may still stand
        if: steps.withdraw.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Never fails the job. Comments only when the action left its pending
        # mark (it read the reviews and did not finish), so an outage before
        # that warns here alone. The marker names the reviews left standing:
        # the same set edits the latest comment, a new set posts a new one.
        run: |
          set +e
          echo "::warning::agent-review withdraw did not finish, so the bot's approval of an older commit may still stand on PR #$PR. A person must check the PR's reviews." | tee -a "$GITHUB_STEP_SUMMARY"
          PENDING="$RUNNER_TEMP/agent-review-withdraw.pending"
          [ -e "$PENDING" ] || exit 0
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 0
          LEFT=$(grep -E '^[0-9]+ [0-9a-f]{40}$' "$PENDING" | sort -n -u)
          MARKER="<!-- agent-review-withdraw ids=$(printf '%s\n' "$LEFT" | cut -d' ' -f1 | paste -s -d, -) -->"
          {
            printf '%s\n' "$MARKER"
            if [ -n "$LEFT" ]; then
              printf '%s\n\n' "⚠️ agent-review could not take back these approvals from \`github-actions\` after the latest change to this PR, so they may still stand:"
              printf '%s\n' "$LEFT" | while read -r REVIEW COMMIT; do printf -- "- the approval of \`%s\` (review %s)\n" "${COMMIT:0:7}" "$REVIEW"; done
              printf '\n%s\n\n' "Check this PR's reviews, and dismiss any of them that is not for the current head."
            else
              printf '%s\n\n' "⚠️ agent-review could not read this PR's reviews after the latest change to it, so the bot's approval of an older commit may still stand. Check this PR's reviews, and dismiss any agent-review approval from \`github-actions\` that is not for the current head."
            fi
            printf '%s\n' "[View the run log]($RUN_URL)"
          } > "$RUNNER_TEMP/withdraw-warning.md"
          if ! FOUND=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- agent-review-withdraw "))) | "\(.id) \(.body | split("\n")[0] | rtrimstr("\r"))"'); then
            echo "::warning::could not read the comments on PR #$PR, so it was not told."
            exit 0
          fi
          LATEST=${FOUND##*$'\n'}
          if [[ "${LATEST%% *}" =~ ^[0-9]+$ ]] && [ "${LATEST#* }" = "$MARKER" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/${LATEST%% *}" -F body=@"$RUNNER_TEMP/withdraw-warning.md" > /dev/null \
              || echo "::warning::could not update the agent-review comment on PR #$PR."
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/withdraw-warning.md" > /dev/null \
              || echo "::warning::could not comment on PR #$PR."
          fi
          exit 0
