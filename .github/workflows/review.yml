name: agent-review (reusable)
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: standard
      debate:
        type: boolean
        default: false
    secrets:
      # Authentication: pass EXACTLY ONE of these. `claude_code_oauth_token` bills a
      # Claude Pro/Max subscription (generate with `claude setup-token`);
      # `anthropic_api_key` bills the metered API.
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Require exactly one auth secret
        env:
          HAS_KEY: ${{ secrets.anthropic_api_key != '' }}
          HAS_OAUTH: ${{ secrets.claude_code_oauth_token != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            echo "::error::Pass anthropic_api_key or claude_code_oauth_token to the reusable workflow."
            exit 1
          fi
      - name: Load the previous trusted report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -sr '[.[][] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- agent-review -->"))] | first | .body // ""' \
            > /tmp/agent_review_previous_comment.md
      - name: Run the review agents
        uses: anthropics/claude-code-action@v1
        env:
          AGENT_REVIEW_CI: '1'
          AGENT_REVIEW_DEBATE: ${{ inputs.debate }}
          AGENT_REVIEW_PREVIOUS_COMMENT: /tmp/agent_review_previous_comment.md
          AGENT_REVIEW_COMMENT_OUT: /tmp/agent_review_comment.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          # The review skill needs shell orchestration, but PR content is
          # attacker-influenceable. Scrub API/GitHub secrets from every Bash
          # subprocess; the deterministic post-step below owns GitHub writes.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Bash,Task"'
          plugin_marketplaces: 'https://github.com/CruGlobal/agent-review.git'
          plugins: 'agent-review@cruglobal'
          prompt: '/agent-review:review ${{ inputs.mode }} ci'
      - name: Publish and verify the current-head report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          COMMENT=/tmp/agent_review_comment.md
          if [ ! -s "$COMMENT" ]; then
            echo "::error::Claude exited without producing an agent-review report."
            exit 1
          fi
          BYTES=$(wc -c < "$COMMENT")
          if [ "$BYTES" -gt 65500 ]; then
            echo "::error::Review comment is $BYTES bytes; GitHub's comment limit is 65,536."
            exit 1
          fi
          REPORT_HEAD=$(tr -d '\r' < "$COMMENT" \
            | sed -n 's/^<!-- agent-review-head: \([0-9a-f]\{7,40\}\) -->$/\1/p' | head -1)
          if [ "$REPORT_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::Report covers '${REPORT_HEAD:-no head}' but current PR head is $EXPECTED_HEAD."
            exit 1
          fi
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -sr '[.[][] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- agent-review -->"))] | first | .id // empty')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@"$COMMENT" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$COMMENT" >/dev/null
          fi
          PUBLISHED=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -sr --arg head "$EXPECTED_HEAD" '[.[][] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- agent-review-head: " + $head + " -->"))] | length')
          if [ "$PUBLISHED" -lt 1 ]; then
            echo "::error::Report postcondition failed: no trusted comment covers $EXPECTED_HEAD."
            exit 1
          fi
