name: agent-review (reusable)
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: standard
      debate:
        type: boolean
        default: false
    secrets:
      # Authentication: pass EXACTLY ONE of these. `claude_code_oauth_token` bills a
      # Claude Pro/Max subscription (generate with `claude setup-token`);
      # `anthropic_api_key` bills the metered API.
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require exactly one auth secret
        env:
          HAS_KEY: ${{ secrets.anthropic_api_key != '' }}
          HAS_OAUTH: ${{ secrets.claude_code_oauth_token != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            echo "::error::Pass anthropic_api_key or claude_code_oauth_token to the reusable workflow."
            exit 1
          fi
      - uses: anthropics/claude-code-action@v1
        env:
          AGENT_REVIEW_CI: '1'
          AGENT_REVIEW_DEBATE: ${{ inputs.debate }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # gh CLI (invoked directly by the review skill's CI-mode steps
          # for `gh pr view` / `gh pr comment` / `gh api`) needs its own
          # auth in the process env — separate from the action's
          # `github_token` input, which only governs the action's
          # internal GitHub operations.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/CruGlobal/agent-review.git'
          plugins: 'agent-review@cruglobal'
          prompt: '/agent-review:review ${{ inputs.mode }} ci'
