name: agent-review approve
description: >-
  Approve a pull request when its published agent-review report passes for the
  PR's current head and no person needs to approve it. Re-checks the base
  commit's human_approval rules, owns the needs-human-approval label, and
  dismisses the bot's own earlier approvals when a person must approve, or its
  approvals of other heads when the rules cannot be read. The approval is pinned
  to the judged commit. Fails closed on any missing or disagreeing marker, never
  requests changes, never fails the job, and downgrades a label, dismissal, or
  approval API failure to a warning.
inputs:
  pr_number:
    description: Pull request number
    required: true
  report_comment_id:
    description: >-
      Issue-comment id of the report to judge; its author must hold repository
      write permission. Empty selects the first PR comment authored by
      github-actions[bot] whose body starts with the agent-review marker.
    required: false
    default: ''
  approval_body:
    description: Review body posted on approval
    required: false
    default: >-
      Auto-approved: the agent-review report for this head passes with no open
      blockers, and no repo rule or card-data check needs a person.
runs:
  using: composite
  steps:
    - name: Load the trusted approval runtime
      uses: actions/checkout@v6
      with:
        repository: CruGlobal/agent-review
        ref: main
        path: .agent-review-approve-runtime
        persist-credentials: false
    - name: Judge the report and approve when it passes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr_number }}
        REPORT_COMMENT_ID: ${{ inputs.report_comment_id }}
        APPROVAL_BODY: ${{ inputs.approval_body }}
      run: |
        set -eEuo pipefail
        # Anything unexpected (API error, deleted comment, runtime failure) is
        # "could not judge": report it and stop successfully, so the calling job
        # (which may already have published a ledger) never fails on approval.
        # Under `set -E` a failure inside $(...) runs this trap in that subshell,
        # where `exit 0` would hand the warning back as the captured value, so a
        # subshell exits 1 and leaves the report to the top-level shell.
        trap '[ "$BASH_SUBSHELL" -eq 0 ] || exit 1; echo "::warning::agent-review approve could not judge PR #$PR (${BASH_COMMAND%% *} failed), not approving." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0' ERR
        # Notes can carry PR or report text, so their copy in the log sits between
        # stop-commands markers, where a line starting with :: is not a command.
        STOP_TOKEN=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        note() {
          echo "$1" >> "$GITHUB_STEP_SUMMARY"
          printf '::stop-commands::%s\n%s\n::%s::\n' "$STOP_TOKEN" "$1" "$STOP_TOKEN"
        }
        warn() { echo "::warning::$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
        LABEL=needs-human-approval
        RUNTIME_DIR="$RUNNER_TEMP/agent-review-approve-runtime"
        rm -rf "$RUNTIME_DIR"
        mv .agent-review-approve-runtime "$RUNTIME_DIR"
        REPORT="$RUNNER_TEMP/agent-review-approve-report.md"
        if [ -n "$REPORT_COMMENT_ID" ]; then
          COMMENT="$RUNNER_TEMP/agent-review-approve-comment.json"
          gh api "repos/$REPO/issues/comments/$REPORT_COMMENT_ID" > "$COMMENT"
          # A report judged by comment id was posted by a person. Only repository
          # writers may trigger an approval, the same bar the interact workflow
          # applies to fix/dismiss commands; author_association alone admits any
          # org member and read-only collaborators.
          AUTHOR=$(jq -r '.user.login // empty' "$COMMENT")
          ISSUE_NUMBER=$(jq -r '.issue_url // "" | split("/") | last' "$COMMENT")
          if [ "$ISSUE_NUMBER" != "$PR" ]; then
            echo "Not approving PR #$PR: comment $REPORT_COMMENT_ID does not belong to it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PERMISSION=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *)
              echo "Not approving PR #$PR: $AUTHOR does not hold repository write permission." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
          esac
          jq -r '.body // empty' "$COMMENT" > "$REPORT"
        else
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -sr '[.[][] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- agent-review -->"))] | first | .body // empty' \
            > "$REPORT"
        fi
        if [ ! -s "$REPORT" ]; then
          echo "No agent-review report found for PR #$PR — not approving." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        PR_JSON="$RUNNER_TEMP/agent-review-approve-pr.json"
        gh api "repos/$REPO/pulls/$PR" > "$PR_JSON"
        HEAD_SHA=$(jq -r .head.sha "$PR_JSON")
        BASE_SHA=$(jq -r .base.sha "$PR_JSON")

        # The rules are read from the base commit so a PR cannot switch off its
        # own rule. Every failure to read them must end as an error rule, which
        # the engine never approves; only a missing config file means no rules.
        CONFIG="$RUNNER_TEMP/agent-review-approve-config.yml"
        FILES_JSON="$RUNNER_TEMP/agent-review-approve-files.json"
        FILES="$RUNNER_TEMP/agent-review-approve-files.txt"
        RULES="$RUNNER_TEMP/agent-review-approve-rules.json"
        RULES_ERROR=""
        if gh api "repos/$REPO/contents/.claude/review/config.yml?ref=$BASE_SHA" \
          --jq 'if .encoding == "base64" then .content else error("the config is not a readable file") end' \
          > "$CONFIG.b64" 2> "$CONFIG.err"; then
          base64 -d < "$CONFIG.b64" > "$CONFIG" || RULES_ERROR="could not read the base config"
        elif grep -qF 'Not Found (HTTP 404)' "$CONFIG.err"; then
          # Matched on the message: a base commit the API cannot find is also an
          # HTTP 404 and must not read as "no config".
          : > "$CONFIG"
        else
          RULES_ERROR="could not read the base config"
        fi
        # The files API stops at 3,000 entries. A list shorter than changed_files
        # goes to human-check marked --incomplete, which refuses it only when the
        # base config sets rules, so a repo with no rules still approves big PRs.
        SHORT_LIST=""
        if [ -z "$RULES_ERROR" ]; then
          if ! gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate > "$FILES_JSON"; then
            RULES_ERROR="could not read the PR's file list"
          elif ! jq -rs '.[][] | .filename, (.previous_filename // empty)' "$FILES_JSON" > "$FILES"; then
            RULES_ERROR="could not read the PR's file list"
          elif ! jq -e --slurpfile pages "$FILES_JSON" \
            '(.changed_files | type == "number") and ([$pages[][] | select(.filename | type == "string")] | length) >= .changed_files' \
            "$PR_JSON" > /dev/null; then
            SHORT_LIST=yes
          fi
        fi
        if [ -z "$RULES_ERROR" ]; then
          if CHECK=$(node "$RUNTIME_DIR/dist/agent-review.cjs" human-check --config "$CONFIG" --files "$FILES" ${SHORT_LIST:+--incomplete}); then
            printf '%s\n' "$CHECK" > "$RULES"
            if [ -n "$SHORT_LIST" ]; then
              note "The file list for PR #$PR is incomplete, but the base config sets no human approval rules, so the full list is not needed."
            fi
          else
            RULES_ERROR=${CHECK#human-check: }
            [ -n "$RULES_ERROR" ] || RULES_ERROR="human-check failed without a message"
          fi
        fi
        if [ -n "$RULES_ERROR" ]; then
          jq -n --arg e "$RULES_ERROR" '{error: $e}' > "$RULES"
          note "Could not check the human approval rules for PR #$PR: $RULES_ERROR"
        fi

        # The engine refuses to approve on a labels value that is not a list, so
        # an unreadable label or owner is written as null rather than guessed.
        LABELS="$RUNNER_TEMP/agent-review-approve-labels.json"
        TIMELINE="$RUNNER_TEMP/agent-review-approve-timeline.json"
        LABEL_OWNER=none
        LABEL_ON_PR=false
        if gh api "repos/$REPO/issues/$PR/labels?per_page=100" --paginate > "$LABELS.pages" \
          && jq -s '[.[][].name]' "$LABELS.pages" > "$LABELS"; then
          if jq -e --arg l "$LABEL" 'any(.[]; ascii_downcase == $l)' "$LABELS" > /dev/null; then
            LABEL_ON_PR=true
            if gh api "repos/$REPO/issues/$PR/timeline?per_page=100" --paginate > "$TIMELINE" \
              && OWNER=$(jq -rs --arg l "$LABEL" '
                [.[][] | select(.event == "labeled" and ((.label.name // "") | ascii_downcase) == $l)]
                | last
                | if . == null then "none" elif .actor.login == "github-actions[bot]" then "bot" else "person" end
              ' "$TIMELINE"); then
              LABEL_OWNER=$OWNER
            else
              note "Could not read who added the $LABEL label to PR #$PR."
              echo null > "$LABELS"
            fi
          fi
        else
          note "Could not read the labels on PR #$PR."
          echo null > "$LABELS"
        fi

        DECISION=$(node "$RUNTIME_DIR/dist/agent-review.cjs" approval --report "$REPORT" --head "$HEAD_SHA" --rules "$RULES" --labels "$LABELS" --label-owner "$LABEL_OWNER")
        APPROVE=$(printf '%s' "$DECISION" | jq -r '.approve')
        REASON=$(printf '%s' "$DECISION" | jq -r '.reason')
        LABEL_ACTION=$(printf '%s' "$DECISION" | jq -r '.label')
        DISMISS=$(printf '%s' "$DECISION" | jq -r '.dismissBotApprovals')
        CAUTION=$(printf '%s' "$DECISION" | jq -r '.caution // empty')
        note "Decision for PR #$PR: approve=$APPROVE, label=$LABEL_ACTION, dismiss bot approvals=$DISMISS. $REASON"

        # Label and dismissal calls sit in `if` conditions so a failure is a
        # warning and can never fire the ERR trap.
        case "$LABEL_ACTION" in
          add)
            # Adding a label that is already on the PR can log a new bot labeled
            # event, which would make a person's label the bot's.
            if [ "$LABEL_ON_PR" = true ]; then
              note "The $LABEL label is already on PR #$PR."
            else
              gh label create "$LABEL" --repo "$REPO" --color B60205 --description "agent-review: a person must approve this PR" 2>/dev/null || true
              if gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" > /dev/null; then
                note "Added the $LABEL label to PR #$PR."
              else
                warn "could not add the $LABEL label to PR #$PR."
              fi
            fi
            ;;
          remove)
            if gh api -X DELETE "repos/$REPO/issues/$PR/labels/$LABEL" > /dev/null; then
              note "Removed the $LABEL label the bot had added to PR #$PR."
            else
              warn "could not remove the $LABEL label from PR #$PR."
            fi
            ;;
        esac
        # all: every approval the bot posted. stale: only those on another head.
        # The runtime and this script are fetched separately and may differ in
        # version, so any value but none or stale is treated as all.
        case "$DISMISS" in
          none) DISMISS_MODE="" ;;
          stale) DISMISS_MODE=stale ;;
          *) DISMISS_MODE=all ;;
        esac
        if [ -n "$DISMISS_MODE" ]; then
          if BOT_APPROVALS=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate \
            | jq -rs --arg mode "$DISMISS_MODE" --arg head "$HEAD_SHA" \
              '.[][] | select(.user.login == "github-actions[bot]" and .state == "APPROVED" and ($mode == "all" or .commit_id != $head)) | .id'); then
            for REVIEW_ID in $BOT_APPROVALS; do
              if gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/dismissals" -f message="agent-review: $REASON" -f event=DISMISS > /dev/null; then
                note "Dismissed the bot's earlier approval on PR #$PR (review $REVIEW_ID)."
              else
                warn "could not dismiss the bot's earlier approval on PR #$PR (review $REVIEW_ID). A person must dismiss it."
              fi
            done
          else
            warn "could not list the reviews on PR #$PR, so the bot's earlier approvals were not dismissed."
          fi
        fi

        if [ "$APPROVE" != "true" ]; then
          note "Not approving PR #$PR: $REASON"
          exit 0
        fi
        # The approval is pinned to the judged commit, and a stale approval still
        # counts toward merging, so a head that moved since the first read must
        # not be approved.
        CURRENT_HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
        if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
          note "Not approving PR #$PR: the PR head moved while it was being judged."
          exit 0
        fi
        BODY=$APPROVAL_BODY
        if [ -n "$CAUTION" ]; then
          BODY="$APPROVAL_BODY"$'\n\n'"$CAUTION"
        fi
        # Needs the repo/org setting "Allow GitHub Actions to create and approve
        # pull requests" (off by GitHub default). A 422 here means it is disabled:
        # warn instead of failing, so a passing review never shows as a red check.
        if gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$HEAD_SHA" -f event=APPROVE -f body="$BODY" > /dev/null; then
          note "Approved PR #$PR: $REASON"
          if [ -n "$CAUTION" ]; then note "$CAUTION"; fi
        else
          warn "Review passed but approval failed. Enable 'Allow GitHub Actions to create and approve pull requests' in repo/org Actions settings."
        fi
