version: 1

# Global severity/verbosity dial (CodeRabbit `profile` model).
# chill     → fewer, high-confidence findings; raises consensus threshold
# standard  → current behavior (default)
# assertive → more findings, lower threshold, may be nitpicky
profile: standard

# ── Risk scoring (migrated from code-review.md) ───────────────────────────────
risk:
  # File-pattern contributions. `tier` is descriptive; `points` drives the score.
  patterns:
    - { glob: 'src/app/api/auth/**', points: 3, tier: critical }
    - { glob: 'src/lib/supabase/**', points: 3, tier: critical }
    - { glob: 'supabase/migrations/**', points: 3, tier: critical }
    - { glob: 'next.config.{js,ts}', points: 3, tier: critical }
    - { glob: '.github/workflows/**', points: 3, tier: critical }
    # Review-harness integrity (commands/rules/settings) is critical; engine source is ordinary code.
    - { glob: '.claude/commands/**', points: 3, tier: critical }
    - { glob: '.claude/settings.json', points: 3, tier: critical }
    - { glob: 'src/app/api/**', points: 2, tier: high }
    - {
        glob: 'src/lib/{billing,stripe,networth,allocation,projections,dividends,tax,spend,plaid,inngest}/**',
        points: 2,
        tier: high,
      }
    - { glob: 'src/components/shared/**', points: 2, tier: high }
    - { glob: '.claude/rules/**', points: 2, tier: high }
    - { glob: 'src/components/**/*.{ts,tsx}', points: 1, tier: medium }
    - { glob: 'src/lib/**/*.ts', points: 1, tier: medium }
    - { glob: 'src/app/(app)/**/*.tsx', points: 1, tier: medium }
    - { glob: '.claude/review/engine/**', points: 1, tier: medium }
    # Low-risk overrides (explicit 0 points)
    - { glob: '**/*.test.{ts,tsx}', points: 0, tier: low }
    - { glob: 'e2e/**', points: 0, tier: low }
    - { glob: '**/*.snap', points: 0, tier: low }

  # Change-volume → points (lines changed across the diff).
  volume_multiplier:
    - { upTo: 50, points: 0 }
    - { upTo: 200, points: 1 }
    - { upTo: 500, points: 2 }
    - { upTo: 1000, points: 3 }
    - { upTo: null, points: 4 } # 1000+

  # Scope multiplier applied to the pattern+volume subtotal.
  scope_multiplier:
    single_file: 1.0
    single_feature: 1.0
    multi_feature: 1.3
    cross_cutting: 1.7
    core_infra: 2.0

  # Special detections (from code-review.md "Special Pattern Detection").
  special:
    - { when: new_dependency, points: 2 }
    - {
        when: critical_pkg_update,
        points: 3,
        packages:
          [
            next,
            react,
            react-dom,
            typescript,
            '@supabase/supabase-js',
            '@tanstack/react-query',
            '@mui/material',
            react-hook-form,
            zod,
            stripe,
            plaid,
            inngest,
          ],
      }
    - { when: lockfile_only_change, points: 1 }
    - { when: next_config_security_change, points: 2 } # rewrites/headers/CSP/image domains
    - { when: supabase_migration_change, points: 3 }

  # Score → risk level + required reviewer (from code-review.md classification).
  levels:
    - { range: [0, 3], level: LOW, reviewer: entry }
    - { range: [4, 6], level: MEDIUM, reviewer: entry }
    - { range: [7, 9], level: HIGH, reviewer: experienced }
    - { range: [10, null], level: CRITICAL, reviewer: 'senior maintainer' }

# ── Agents (the 7 specialists, declaratively) ─────────────────────────────────
agents:
  - id: security
    enabled: true
    model: smart # smart | opus | sonnet | haiku
    always: false # if true, runs regardless of triggers
    triggers:
      paths:
        [
          'src/app/api/**',
          'src/lib/supabase/**',
          'supabase/migrations/**',
          'next.config.{js,ts}',
          '.github/workflows/**',
          '.claude/commands/**',
          '.claude/rules/**',
          '.claude/settings.json',
        ]
      content:
        [
          'process.env.',
          'dangerouslySetInnerHTML',
          'SUPABASE_SERVICE_ROLE',
          'service role',
          'redirect(',
        ]
    rules: ['rules/security.md']

  - id: architecture
    enabled: true
    always: true
    rules: ['rules/architecture.md']

  - id: data-integrity
    enabled: true
    triggers:
      paths:
        [
          'supabase/migrations/**',
          'src/lib/supabase/**',
          'src/lib/db/**',
          'src/components/**/*.tsx',
        ]
      content:
        [
          'useMutation',
          'invalidateQueries',
          'setQueryData',
          'queryClient',
          'staleTime',
          'optimistic',
          '.parse(',
          '.safeParse(',
          'upsert(',
          'rpc(',
        ]
    rules: ['rules/data-integrity.md']

  - id: testing
    enabled: true
    always: true
    rules: ['rules/testing.md']

  - id: ux
    enabled: true
    triggers:
      paths:
        [
          'src/components/**/*.tsx',
          'src/app/(app)/**/*.tsx',
          'src/components/theme/**',
        ]
      content: ['useForm', 'Controller', 'register(', 'sx={', 'useQuery']
    rules: ['rules/ux.md']

  - id: financial
    enabled: true
    triggers:
      paths:
        [
          'src/lib/{networth,allocation,projections,dividends,tax,billing,spend}/**',
          'src/components/{wealth,invest,spend,cards}/**',
        ]
      content:
        [
          'amount',
          'currency',
          'balance',
          'total',
          'gain',
          'costBasis',
          'reduce((',
          '.toFixed(',
          'Math.round(',
          'parseFloat(',
          'xirr',
        ]
    rules: ['rules/financial.md']

  - id: standards
    enabled: true
    always: true
    rules: ['rules/standards.md']

# ── Per-path rules (CodeRabbit path_instructions model) ───────────────────────
# Applied to ALL agents reviewing matching files, in addition to agent-specific rules.
path_rules:
  - { paths: ['src/components/**/*.tsx'], rules: ['rules/ux.md'] }
  - { paths: ['src/app/api/**'], rules: ['rules/security.md'] }
  - {
      paths:
        [
          'src/lib/{networth,allocation,projections,dividends,tax,billing,spend}/**',
        ],
      rules: ['rules/financial.md'],
    }

# ── Exclusions (from code-review.md "Excluded Paths") ─────────────────────────
excluded_paths:
  - '**/*.generated.ts'
  - 'public/**'
  - '**/*.snap'
  - '.github/ISSUE_TEMPLATE/**'
  - 'docs/**'
  - '.claude/review/rules/**' # prose rule docs — config/guidance, not reviewable code
  - '.claude/docs/**' # research/reference docs
  # Package-manager artifacts — generated/vendored, never reviewable
  - 'yarn.lock'
  - 'package-lock.json'
  - 'pnpm-lock.yaml'

# ── Index layer (Phase B): file-level import graph for impact analysis ────────
index: { enabled: true, path: '.claude/review/index' }

# ── Learning layer (Phase C): approval-gated feedback loop ────────────────────
learning:
  enabled: true
  path: '.claude/review/learnings'
  approval_required: true
  min_support: 3
  scope: local

enforcement:
  mode: warn # warn | block — reserved for future merge-gating
